_variables: &vars
    - ozone
    - carbon_monoxyde
    - pm10
    - air_pressure
    - air_pressure_levels
    - surface_geopotential
_chemVariables: &chemvars
    - ozone
    - carbon_monoxyde
    - pm10

geometry:
  function space: StructuredColumns
  grid:
    type: structured
    xspace:
      type: linear
      N : 351
      start : -35.0
      end :  35.0
    yspace:
      type: linear
      N: 271
      start: -27.0
      end : 27.0
    projection :
      type: rotated_lonlat
      north_pole: [190, 39]
    y_numbering: -1
  partitioner: checkerboard
  groups:
  - variables:
    - ozone
    - carbon_monoxyde
    - pm10
    levels: 5
  - variables:
    - lev_height
    - air_pressure
    levels: 5
  - variables:
    - air_pressure_levels
    levels: 6
  - variables:
    - air_pressure_at_surface
    - surface_geopotential
    levels: 1
    lev2d: down
  alias:
  - in code: ozone
    in file: O3
  - in code: carbon_monoxyde
    in file: CO
  - in code: pm10
    in file: dry_pm10_mass
  - in code: lev_height
    in file: mid_layer_height_agl
  - in code: air_pressure
    in file: mid_layer_pressure
  - in code: air_pressure_levels
    in file: interface_pressure
  - in code: air_pressure_at_surface
    in file: PSFC
  - in code: surface_geopotential
    in file: FIS
  io:
    total number of levels: 24
    levels selection: [20,21,22,23,24]
    pressure levels selection: [20,21,22,23,24,25]
    initial date: 2022-06-30T12:00:00Z
    final date: 2022-07-02T00:00:00Z
  levels are top down: true

ensemble:
  members from template:
    template:
      date: 2022-07-01T12:00:00Z
      filepath: testdata/%mem%/REDUCED_MONARCH_d01_2022063012.nc
      format: bsc
      state variables: *chemvars
    pattern: %mem%
    zero padding: 3
    nmembers: 6

variance output:
  filepath: testdata/monarch_variance.nc
  formats: [bsc]
  date: 2022-07-01T12:00:00Z

standard deviation output:
  filepath: testdata/monarch_sttdev.nc
  formats: [bsc]
  date: 2022-07-01T12:00:00Z

mean output:
  filepath: testdata/monarch_mean.nc
  formats: [bsc]
  date: 2022-07-01T12:00:00Z

test:
  reference filename: testref/jedi/monarch_ens_mean_variance.ref
  test output filename: testdata/monarch_ens_mean_variance.log
