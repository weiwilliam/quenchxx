_variables: &vars
    - ozone
    - carbon_monoxyde
    - pm10
    - air_pressure
    - air_pressure_levels
    - surface_geopotential

geometry:
  function space: StructuredColumns
  grid:
    type: structured
    xspace:
      type: linear
      N : 351
      start : -35.0
      end :  35.0
    yspace:
      type: linear
      N: 271
      start: -27.0
      end : 27.0
    projection :
      type: rotated_lonlat
      north_pole: [190, 39]
    y_numbering: -1
  partitioner: checkerboard
  groups:
  - variables:
    - ozone
    - carbon_monoxyde
    - pm10
    levels: 5
  - variables:
    - lev_height
    - air_pressure
    levels: 5
  - variables:
    - air_pressure_levels
    levels: 6
  - variables:
    - air_pressure_at_surface
    - surface_geopotential
    levels: 1
    lev2d: down
  alias:
  - in code: ozone
    in file: O3
  - in code: carbon_monoxyde
    in file: CO
  - in code: pm10
    in file: dry_pm10_mass
  - in code: lev_height
    in file: mid_layer_height_agl
  - in code: air_pressure
    in file: mid_layer_pressure
  - in code: air_pressure_levels
    in file: interface_pressure
  - in code: air_pressure_at_surface
    in file: PSFC
  - in code: surface_geopotential
    in file: FIS
  io:
    total number of levels: 24
    levels selection: [20,21,22,23,24]
    pressure levels selection: [20,21,22,23,24,25]
    initial date: 2022-06-30T12:00:00Z
    final date: 2022-07-02T00:00:00Z
  levels are top down: true

state test:
  statefile:
    date: 2022-07-01T00:00:00Z
    filepath: testdata/006/REDUCED_MONARCH_d01_2022063012.nc
    format: bsc
    state variables: *vars
  write then read test:
    state write:
      date: 2022-07-01T00:00:00Z
      filepath: testdata/monarch_state_out.nc
      formats: [bsc]
      state variables: *vars
    state read:
      date: 2022-07-01T00:00:00Z
      filepath: testdata/monarch_state_out.nc
      format: bsc
      state variables: *vars
  date: 2022-07-01T00:00:00Z
  norm file: 97992658.179103971
  tolerance: 2.0e-08
  test variable change constructor: false
